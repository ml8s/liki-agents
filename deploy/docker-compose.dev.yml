services:
  engine-mcp:
    image: liki-engine:latest
    build:
      context: ../../../liki/engine
      dockerfile: deploy/Dockerfile
    entrypoint: ["/usr/local/bin/liki-mcp", "--addr", ":8081"]
    ports:
      - "18081:8081"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"

  liki-agent:
    image: liki-agent:latest
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${LIKI_AGENT_VERSION:-dev}
        COMMIT: ${LIKI_AGENT_COMMIT:-unknown}
        BUILD_TIME: ${LIKI_AGENT_BUILD_TIME:-unknown}
    environment:
      LIKI_ENV: development
      LIKI_AGENT_INTERNAL_TOKEN: ${LIKI_AGENT_INTERNAL_TOKEN:-dev-agent-token}
      LIKI_AGENT_PUBLIC_URL: ${LIKI_AGENT_PUBLIC_URL:-http://127.0.0.1:8083}
      LIKI_DB_PATH: /data/liki-agent-audit.db
      LIKI_ENGINE_MCP_URL: http://engine-mcp:8081/mcp
      LIKI_ENGINE_MCP_TOKEN: ${LIKI_ENGINE_MCP_TOKEN:-}
      LIKI_ENGINE_CONTRACT_VERSION: ${LIKI_ENGINE_CONTRACT_VERSION:-2026.09.21.3}
      LIKI_ENGINE_ALLOWED_TOOLS: ${LIKI_ENGINE_ALLOWED_TOOLS:-bazi_chart,ziwei_chart,tianwen_time,city_coords}
      LIKI_LLM_BASE_URL: ${LIKI_LLM_BASE_URL:-https://api.openai.com/v1}
      LIKI_LLM_API_KEY: ${LIKI_LLM_API_KEY}
      LIKI_LLM_MODEL: ${LIKI_LLM_MODEL:-gpt-4.1-mini}
      LIKI_LLM_TEMPERATURE: ${LIKI_LLM_TEMPERATURE:-0.2}
    ports:
      - "8083:8083"
    volumes:
      - liki-agent-data:/data
    restart: unless-stopped
    depends_on:
      engine-mcp:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

volumes:
  liki-agent-data:
